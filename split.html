<title>錢去哪了？</title>
<style>
  :root{
    --blue:#7d977f; --blue-d:#647f68; --bg:#f4ece1; --card:#fffdf9;
    --line:#e8ddcd; --ink:#4a4640; --sub:#9a9082; --green:#7d977f;
    --red:#b67d70; --amber:#cda35f; --chip:#efe3d2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:90px;}
  header{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .h-top{display:flex;align-items:center;gap:10px;}
  .h-top select{flex:1;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:600;}
  .h-top select option{color:#000;}
  .icon-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .h-sum{display:flex;justify-content:space-between;margin-top:12px;gap:8px;}
  .h-sum .box{flex:1;text-align:center;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 4px;}
  .h-sum .box .n{font-size:20px;font-weight:700;}
  .h-sum .box .l{font-size:11px;opacity:.85;margin-top:2px;}
  main{padding:14px;}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .card h2{margin:0 0 10px;font-size:15px;color:var(--sub);font-weight:700;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px;}
  .chip .x{color:var(--sub);font-weight:700;cursor:pointer;padding:2px 4px;}
  .item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
  .item .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .item .nm{font-weight:600;font-size:16px;}
  .item .amt{font-weight:700;color:var(--ink);white-space:nowrap;}
  .item .meta{font-size:13px;color:var(--sub);margin-top:4px;}
  .item .meta b{color:var(--blue);font-weight:600;}
  .item .time{font-size:12px;color:var(--sub);margin-top:3px;}
  .item .acts{display:flex;gap:14px;margin-top:8px;}
  .item .acts span{font-size:13px;color:var(--sub);cursor:pointer;padding:4px 0;}
  .item .acts .del{color:var(--red);}
  .empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px;}
  .person-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .person-row:last-child{border-bottom:none;}
  .person-row .nm{font-weight:600;}
  .person-row .det{font-size:12px;color:var(--sub);margin-top:2px;}
  .bal{font-weight:700;text-align:right;}
  .bal.pos{color:var(--green);}.bal.neg{color:var(--red);}
  .settle{display:flex;align-items:center;gap:8px;font-size:15px;padding:10px 0;border-bottom:1px dashed var(--line);}
  .settle:last-child{border-bottom:none;}
  .settle .ar{color:var(--blue);font-weight:700;}
  .settle .m{margin-left:auto;font-weight:700;}
  .hist{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .hist:last-child{border-bottom:none;}
  .hist.on{background:#f3ebde;border-radius:10px;padding:11px 10px;}
  .hist .hnm{font-weight:600;}
  .hist .hd{font-size:12px;color:var(--sub);margin-top:2px;}
  .hist .ht{margin-left:auto;text-align:right;font-weight:700;color:var(--blue);}
  .hist .badge{font-size:11px;background:var(--blue);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--blue);color:#fff;border:none;border-radius:30px;padding:15px 28px;font-size:17px;font-weight:700;box-shadow:0 6px 18px rgba(125,151,127,.5);z-index:30;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;}
  .mask.on{display:flex;}
  .sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 16px 34px;max-height:90vh;overflow-y:auto;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet h3{margin:0 0 14px;font-size:18px;}
  label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px;font-weight:600;}
  input.f,select.f{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);}
  .who{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;}
  .who .p{padding:8px 14px;border:1px solid var(--line);border-radius:20px;font-size:14px;background:#fff;cursor:pointer;}
  .who .p.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
  .who .allbtn{padding:8px 14px;border:1px dashed var(--blue);color:var(--blue);border-radius:20px;font-size:14px;font-weight:600;background:#fff;cursor:pointer;}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:700;margin-top:18px;cursor:pointer;}
  .btn.pri{background:var(--blue);color:#fff;}
  .btn.gho{background:#f3f4f6;color:var(--ink);margin-top:8px;}
  .menu-item{padding:14px 4px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;}
  .menu-item:active{opacity:.7;}
  .menu-item.danger{color:var(--red);}
  .addp-row{display:flex;gap:8px;align-items:stretch;}
  .addp-row input{flex:1;min-width:0;}
  .addp-row button{padding:12px 16px;border:none;background:var(--blue);color:#fff;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;min-height:48px;}
  .quick-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .quick-tag{padding:7px 14px;border:1.5px solid var(--line);border-radius:20px;font-size:14px;background:#fff;cursor:pointer;color:var(--ink);}
  .quick-tag.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
  textarea.f{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);resize:none;height:72px;font-family:inherit;}
  .dlg-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;}
  .dlg-mask.on{display:flex;}
  .dlg{background:#fff;border-radius:16px;padding:22px 18px 16px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
  .dlg h4{margin:0 0 12px;font-size:17px;color:var(--ink);}
  .dlg p{margin:0 0 14px;font-size:15px;color:var(--sub);line-height:1.5;}
  .dlg input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:14px;}
  .dlg-btns{display:flex;gap:8px;}
  .dlg-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;}
  .dlg-btns .ok{background:var(--blue);color:#fff;}
  .dlg-btns .ok.danger{background:var(--red);}
  .dlg-btns .ca{background:#f3f4f6;color:var(--ink);}
  /* 登入頁 */
  #loginPage{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
  #loginPage .logo{font-size:52px;margin-bottom:8px;}
  #loginPage h1{font-size:22px;font-weight:700;margin:0 0 4px;}
  #loginPage p{font-size:14px;color:var(--sub);margin:0 0 28px;}
  #loginPage input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:12px;background:#fff;color:var(--ink);}
  #loginPage .login-btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px;}
  #loginPage .switch{font-size:14px;color:var(--sub);text-align:center;cursor:pointer;}
  #loginPage .switch b{color:var(--blue);}
  #loginPage .err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-bottom:8px;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;margin-left:6px;}
  .sync-dot.ok{background:#7d977f;}.sync-dot.err{background:var(--red);}.sync-dot.ing{background:var(--amber);}
  #userBar{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85;margin-top:8px;}
  /* 結算卡片 */
  #cardMask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  #cardMask.on{display:flex;}
  #cardWrapper{width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden;}
  #shareCard{background:#fff;overflow-y:auto;flex:1;}
  #shareCard{border-radius:0;}
  .card-head{background:linear-gradient(135deg,#7d977f,#647f68);padding:20px 18px 16px;color:#fff;}
  .card-head .ctitle{font-size:19px;font-weight:700;}
  .card-head .csub{font-size:12px;opacity:.8;margin-top:2px;}
  .card-head .ctotal{font-size:30px;font-weight:700;margin-top:10px;}
  .card-body{padding:16px 18px 8px;}
  .card-section{margin-bottom:14px;}
  .card-section h4{font-size:11px;color:#9a9082;font-weight:700;letter-spacing:.5px;margin:0 0 6px;}
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f0e8da;gap:8px;}
  .card-row:last-child{border-bottom:none;}
  .card-row .lft{flex:1;}
  .card-row .nm{font-size:14px;font-weight:600;}
  .card-row .sub{font-size:11px;color:#aaa;margin-top:2px;}
  .card-row .val{font-size:14px;font-weight:700;white-space:nowrap;}
  .card-row .val.red{color:#b67d70;}
  .card-row .val.grn{color:#7d977f;}
  .card-row .val.gry{color:#aaa;font-weight:400;}
  .settle-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #f0e8da;font-size:14px;gap:4px;}
  .settle-row:last-child{border-bottom:none;}
  .settle-row .arrow{color:#7d977f;font-weight:700;}
  .settle-row .samt{margin-left:auto;font-weight:700;}
  .card-foot{background:#fff;padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid #f0e8da;flex-shrink:0;}
  .card-foot button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
  .card-foot .cls{background:#f3f4f6;color:#4a4640;}
  .card-foot .shr{background:#7d977f;color:#fff;}
  /* 結算卡片 */
  #cardMask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;}
  #cardMask.on{display:flex;}
  #shareCard{background:#fff;border-radius:20px;width:100%;max-width:360px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .card-head{background:linear-gradient(135deg,#7d977f,#647f68);padding:20px 18px 16px;color:#fff;}
  .card-head .ctitle{font-size:20px;font-weight:700;margin-bottom:4px;}
  .card-head .csub{font-size:13px;opacity:.85;}
  .card-head .ctotal{font-size:28px;font-weight:700;margin-top:10px;}
  .card-body{padding:16px 18px;}
  .card-section{margin-bottom:14px;}
  .card-section h4{font-size:12px;color:#9a9082;font-weight:700;letter-spacing:.5px;margin:0 0 8px;text-transform:uppercase;}
  .card-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f0e8da;}
  .card-row:last-child{border-bottom:none;}
  .card-row .nm{font-size:14px;font-weight:600;}
  .card-row .val{font-size:14px;font-weight:700;}
  .card-row .val.red{color:#b67d70;}
  .card-row .val.grn{color:#7d977f;}
  .card-row .val.gry{color:#aaa;}
  .arrow{color:#7d977f;font-weight:700;margin:0 6px;}
  .settle-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f0e8da;font-size:14px;}
  .settle-row:last-child{border-bottom:none;}
  .settle-row .amt{margin-left:auto;font-weight:700;color:#4a4640;}
  .card-foot{padding:10px 18px 16px;display:flex;gap:8px;}
  .card-foot button{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
  .card-foot .cls{background:#f3f4f6;color:#4a4640;}
  .card-foot .shr{background:#7d977f;color:#fff;}
</style>

<body>

<!-- 登入頁 -->
<div id="loginPage">
  <div class="logo">🍃</div>

  <input id="lPass" type="password" placeholder="密碼（至少6位）">
  <div class="err" id="lErr"></div>
  <button class="login-btn" id="lBtn" onclick="doLogin()">登入</button>
  <div class="switch" onclick="toggleMode()">還沒有帳號？<b>立即註冊</b></div>

  <div class="h-top">
    <select id="tripSel" onchange="switchTrip(this.value)"></select>

  </div>

    <h2>參與的人</h2>

      <input class="f" id="pQuick" placeholder="輸入姓名後按新增" onkeydown="if(event.key==='Enter')quickAdd()">

<script>
const SB_URL='https://xzmugwhduswltmydzcxs.supabase.co';
const SB_KEY='sb_publishable_BjOgs6fhvzn1C3XYAFa0UA_eUG72R6O';
let sbToken=null, sbUserId=null, sbUserEmail='';
let isRegMode=false;

async function sbFetch(path, opts={}){
  const headers={'Content-Type':'application/json','apikey':SB_KEY,...(sbToken?{'Authorization':'Bearer '+sbToken}:{}),...(opts.headers||{})};
  const res=await fetch(SB_URL+path,{...opts,headers});
  return res;
}

function toggleMode(){
  isRegMode=!isRegMode;
  document.getElementById('lBtn').textContent=isRegMode?'註冊':'登入';
  document.getElementById('loginSub').textContent=isRegMode?'建立新帳號':'登入以雲端備份你的分帳資料';
  document.querySelector('#loginPage .switch').innerHTML=isRegMode?'已有帳號？<b>直接登入</b>':'還沒有帳號？<b>立即註冊</b>';
  document.getElementById('lErr').textContent='';
}

async function doForgot(){
  const email=document.getElementById('lEmail').value.trim();
  if(!email){document.getElementById('lErr').textContent='請先輸入 Email';return;}
  try{
    await fetch(SB_URL+'/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({email})});
    document.getElementById('lErr').style.color='var(--green)';
    document.getElementById('lErr').textContent='重設信已寄出，請檢查信箱';
  }catch(e){document.getElementById('lErr').textContent='寄送失敗，請稍後再試';}
}

async function doLogin(){
  const email=document.getElementById('lEmail').value.trim();
  const pass=document.getElementById('lPass').value;
  const errEl=document.getElementById('lErr');
  errEl.textContent=''; errEl.style.color='var(--red)';
  if(!email||!pass){errEl.textContent='請輸入 Email 和密碼';return;}
  document.getElementById('lBtn').textContent='請稍候...';
  const endpoint=isRegMode?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  try{
    const res=await fetch(SB_URL+endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({email,password:pass})});
    const data=await res.json();
    if(data.access_token){
      sbToken=data.access_token; sbUserId=data.user?.id; sbUserEmail=data.user?.email||email;
      try{localStorage.setItem('sb_token',sbToken);localStorage.setItem('sb_email',sbUserEmail);}catch(e){}
      document.getElementById('loginPage').style.display='none';
      document.getElementById('userEmail').textContent=sbUserEmail;
      await loadFromCloud();
    } else if(isRegMode&&data.id){
      errEl.textContent='註冊成功！請登入'; isRegMode=false; toggleMode();
    } else {
      errEl.textContent=data.error_description||data.msg||'登入失敗，請確認帳號密碼';
    }
  }catch(e){errEl.textContent='網路錯誤，請稍後再試';}
  document.getElementById('lBtn').textContent=isRegMode?'註冊':'登入';
}

async function doLogout(){
  sbToken=null; sbUserId=null;
  try{localStorage.removeItem('sb_token');localStorage.removeItem('sb_email');}catch(e){}
  db=null; cur=null;
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('lPass').value='';
  close_('mMenu');
}

function setSyncDot(state){document.getElementById('syncDot').className='sync-dot '+state;}

async function loadFromCloud(){
  setSyncDot('ing');
  try{
    const res=await sbFetch('/rest/v1/split_trips?select=*&order=updated_at.desc',{headers:{'Prefer':'return=representation'}});
    const rows=await res.json();
    if(Array.isArray(rows)&&rows.length){
      db={cur:0,trips:rows.map(r=>({id:r.id,name:r.name,cur:r.cur,date:r.date,people:r.people||[],items:r.items||[]}))};
    } else {
      db={cur:0,trips:[blankTrip('我的出遊')]};
      await saveToCloud(db.trips[0]);
    }
    cur=db.trips[0]; render(); setSyncDot('ok');
  }catch(e){setSyncDot('err');db={cur:0,trips:[blankTrip('我的出遊')]};cur=db.trips[0];render();}
}

async function saveToCloud(trip){
  setSyncDot('ing');
  try{
    if(trip.id){
      await sbFetch('/rest/v1/split_trips?id=eq.'+trip.id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({name:trip.name,cur:trip.cur,date:trip.date,people:trip.people,items:trip.items})});
    } else {
      const res=await sbFetch('/rest/v1/split_trips',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({name:trip.name,cur:trip.cur,date:trip.date,people:trip.people,items:trip.items})});
      const rows=await res.json();
      if(rows&&rows[0])trip.id=rows[0].id;
    }
    setSyncDot('ok');
  }catch(e){setSyncDot('err');}
}

async function deleteFromCloud(trip){
  if(!trip.id)return;
  await sbFetch('/rest/v1/split_trips?id=eq.'+trip.id,{method:'DELETE'});
}

let db,cur,editId=null,selWho=[];
const QUICK=['交通','午餐','晚餐','早餐','咖啡','甜點'];

function blankTrip(name){return{name,cur:'THB',date:today(),people:[],items:[]};}
function uid(){return Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts);return(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function money(n){return cur.cur+' '+(Math.round(n*10)/10).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:1});}
function tripTotal(t){return t.items.reduce((s,i)=>s+(+i.amount||0),0);}
function save(){saveToCloud(cur);}

function calc(){
  const r={};cur.people.forEach(p=>r[p]={share:0,paid:0});
  cur.items.forEach(it=>{
    const sh=(it.sharedBy||[]).filter(p=>cur.people.includes(p));
    if(sh.length){const per=it.amount/sh.length;sh.forEach(p=>r[p].share+=per);}
    if(it.payer&&r[it.payer])r[it.payer].paid+=it.amount;
  });
  cur.people.forEach(p=>r[p].bal=r[p].paid-r[p].share);
  return r;
}

function settlements(r){
  const cred=[],deb=[];
  cur.people.forEach(p=>{const b=Math.round(r[p].bal*100)/100;if(b>0.009)cred.push({p,v:b});else if(b<-0.009)deb.push({p,v:-b});});
  cred.sort((a,b)=>b.v-a.v);deb.sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<deb.length&&j<cred.length){
    const m=Math.min(deb[i].v,cred[j].v);
    out.push({from:deb[i].p,to:cred[j].p,amt:m});
    deb[i].v-=m;cred[j].v-=m;
    if(deb[i].v<0.01)i++;if(cred[j].v<0.01)j++;
  }
  return out;
}

function render(){
  const sel=document.getElementById('tripSel');
  sel.innerHTML=db.trips.map((t,i)=>`<option value="${i}" ${i===db.cur?'selected':''}>${esc(t.name)}</option>`).join('');
  document.getElementById('curLabel').textContent=cur.cur;
  document.getElementById('people').innerHTML=cur.people.map(p=>`<div class="chip">${esc(p)}<span class="x" onclick="delPerson('${esc(p)}')">✕</span></div>`).join('')||'<div class="empty">尚未加入任何人</div>';
  const ic=document.getElementById('items');
  if(!cur.items.length){ic.innerHTML='<div class="empty">還沒有消費記錄，點下方「記一筆」開始</div>';}
  else ic.innerHTML=cur.items.map(it=>{
    const sh=(it.sharedBy||[]);const per=sh.length?it.amount/sh.length:0;
    return `<div class="item"><div class="row1"><div class="nm">${esc(it.name)}</div><div class="amt">${money(it.amount)}</div></div>
      <div class="meta">墊付：<b>${esc(it.payer||'—')}</b> ・ 分攤：${sh.map(esc).join('、')||'—'} ${sh.length>1?`（每人 ${money(per)}）`:''}</div>
      ${it.note?`<div class="time">📝 ${esc(it.note)}</div>`:''}
      ${it.ts?`<div class="time">🕒 ${fmtTime(it.ts)}</div>`:''}
      <div class="acts"><span onclick="openItem('${it.id}')">✏️ 編輯</span><span class="del" onclick="delItem('${it.id}')">🗑 刪除</span></div></div>`;
  }).join('');
  const total=tripTotal(cur);
  document.getElementById('sTotal').textContent=Math.round(total);
  document.getElementById('sCount').textContent=cur.items.length;
  document.getElementById('sPpl').textContent=cur.people.length;
  const r=calc();
  document.getElementById('persons').innerHTML=cur.people.length?cur.people.map(p=>{
    const b=r[p].bal,cls=b>0.01?'pos':(b<-0.01?'neg':'');
    const tag=b>0.01?`應收回 ${money(b)}`:(b<-0.01?`還需付 ${money(-b)}`:'已結清');
    return `<div class="person-row"><div><div class="nm">${esc(p)}</div><div class="det">應付 ${money(r[p].share)} ・ 已墊付 ${money(r[p].paid)}</div></div><div class="bal ${cls}">${tag}</div></div>`;
  }).join(''):'<div class="empty">尚未加入人員</div>';
  const st=settlements(r);
  const sc=document.getElementById('settle');
  if(!st.length){sc.innerHTML='<div class="empty">無需結算</div>';}
  else sc.innerHTML=st.map(s=>`<div class="settle">${esc(s.from)} <span class="ar">→</span> ${esc(s.to)} <span class="m">${money(s.amt)}</span></div>`).join('');
  document.getElementById('history').innerHTML=db.trips.map((t,i)=>{
    const isCur=i===db.cur;
    return `<div class="hist ${isCur?'on':''}" onclick="switchTrip(${i})"><div><div class="hnm">${esc(t.name)}${isCur?'<span class="badge">目前</span>':''}</div><div class="hd">${t.date||''} ・ ${t.items.length} 筆 ・ ${t.people.length} 人</div></div><div class="ht">${t.cur} ${Math.round(tripTotal(t))}</div></div>`;
  }).join('');
}
function esc(s){return(s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function unesc(s){return(s+'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");}

function open_(id){document.getElementById(id).classList.add('on');}
function close_(id){document.getElementById(id).classList.remove('on');}
function openMenu(){open_('mMenu');}

let dlgResolve=()=>{};
function showDlg({title='',msg='',input=false,inputVal='',okText='確定',okDanger=false,showCancel=true}){
  return new Promise(res=>{
    dlgResolve=res;
    document.getElementById('dlgTitle').textContent=title;
    const msgEl=document.getElementById('dlgMsg');
    if(msg){msgEl.textContent=msg;msgEl.style.display='';}else{msgEl.style.display='none';}
    const inp=document.getElementById('dlgInput');
    if(input){inp.style.display='';inp.value=inputVal;setTimeout(()=>inp.focus(),100);}else{inp.style.display='none';}
    const ok=document.getElementById('dlgOk');
    ok.textContent=okText;ok.className='ok'+(okDanger?' danger':'');
    inp.onkeydown=e=>{if(e.key==='Enter')document.getElementById('dlgOk').click();};
    document.getElementById('dlgCancel').style.display=showCancel?'':'none';
    document.getElementById('dlgMask').classList.add('on');
  });
}
document.getElementById('dlgOk').addEventListener('click',()=>{
  const inp=document.getElementById('dlgInput');
  const val=inp.style.display===''?inp.value:true;
  document.getElementById('dlgMask').classList.remove('on');
  dlgResolve(val);
},{capture:true});
document.getElementById('dlgCancel').addEventListener('click',()=>{
  document.getElementById('dlgMask').classList.remove('on');
  dlgResolve(null);
},{capture:true});
async function myAlert(title,msg=''){await showDlg({title,msg,showCancel:false,okText:'好'});}
async function myConfirm(title,msg=''){return await showDlg({title,msg,okText:'確定',okDanger:true});}
async function myPrompt(title,defaultVal=''){return await showDlg({title,input:true,inputVal:defaultVal,okText:'確定'});}

function renderQuickTags(){
  const v=document.getElementById('iName').value.trim();
  document.getElementById('quickTags').innerHTML=QUICK.map(t=>`<div class="quick-tag ${v===t?'on':''}" onclick="pickTag('${t}')">${t}</div>`).join('');
}
function pickTag(t){const inp=document.getElementById('iName');inp.value=inp.value.trim()===t?'':t;renderQuickTags();}

function previewAmt(){
  const v=document.getElementById('iAmt').value.trim();
  const el=document.getElementById('amtPreview');
  if(!v){el.textContent='';return;}
  try{
    const safe=v.replace(/[^0-9+\-*/.]/g,'');
    const result=Function('"use strict";return ('+safe+')')();
    if(isFinite(result)&&result>0){el.textContent='= '+Math.round(result*100)/100;}
    else{el.textContent='';}
  }catch(e){el.textContent='';}
}
function parseAmt(v){
  try{
    const safe=v.replace(/[^0-9+\-*/.]/g,'');
    const result=Function('"use strict";return ('+safe+')')();
    return isFinite(result)?result:NaN;
  }catch(e){return NaN;}
}

function openItem(id){
  if(!cur.people.length){myAlert('請先新增人員','請先在上方新增參與的人');return;}
  editId=id||null;
  const payer=document.getElementById('iPayer');
  payer.innerHTML='<option value="">（暫不設定）</option>'+cur.people.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  if(id){
    const it=cur.items.find(x=>x.id===id);
    document.getElementById('itemTitle').textContent='編輯';
    iName.value=it.name;iAmt.value=it.amount;payer.value=it.payer||'';
    document.getElementById('iNote').value=it.note||'';
    selWho=[...(it.sharedBy||[])];
  }else{
    document.getElementById('itemTitle').textContent='記一筆';
    iName.value='';iAmt.value='';payer.value='';
    document.getElementById('iNote').value='';
    selWho=[...cur.people];
  }
  renderQuickTags();renderWho();open_('mItem');
  setTimeout(()=>iName.focus(),200);
}
function renderWho(){
  document.getElementById('iWho').innerHTML=`<div class="allbtn" onclick="toggleAll()">${selWho.length===cur.people.length?'全不選':'全選'}</div>`+cur.people.map(p=>`<div class="p ${selWho.includes(p)?'on':''}" onclick="togWho('${esc(p)}')">${esc(p)}</div>`).join('');
}
function togWho(p){p=unesc(p);if(selWho.includes(p))selWho=selWho.filter(x=>x!==p);else selWho.push(p);renderWho();}
function toggleAll(){selWho=selWho.length===cur.people.length?[]:[...cur.people];renderWho();}
async function saveItem(){
  const name=iName.value.trim();const amt=parseAmt(iAmt.value);
  if(!name){await myAlert('請輸入項目名稱');return;}
  if(!(amt>0)){await myAlert('請輸入正確金額');return;}
  if(!selWho.length){await myAlert('請至少選一個分攤的人');return;}
  const payer=document.getElementById('iPayer').value;
  const note=document.getElementById('iNote').value.trim();
  if(editId){const it=cur.items.find(x=>x.id===editId);it.name=name;it.amount=amt;it.payer=payer;it.sharedBy=[...selWho];it.note=note;}
  else{cur.items.push({id:uid(),name,amount:amt,payer,sharedBy:[...selWho],note,ts:Date.now()});}
  save();render();close_('mItem');
}
async function delItem(id){
  if(await myConfirm('確定刪除？','這筆消費將被移除')){cur.items=cur.items.filter(x=>x.id!==id);save();render();}
}

async function quickAdd(){
  const el=document.getElementById('pQuick');
  const n=el.value.trim();
  if(!n)return;
  if(cur.people.includes(n)){await myAlert('重複','已經有這個人了');return;}
  cur.people.push(n);el.value='';save();render();el.focus();
}
async function delPerson(p){
  p=unesc(p);
  if(!await myConfirm('移除 '+p+'？','相關消費裡的分攤/墊付會一併清除'))return;
  cur.people=cur.people.filter(x=>x!==p);
  cur.items.forEach(it=>{it.sharedBy=(it.sharedBy||[]).filter(x=>x!==p);if(it.payer===p)it.payer='';});
  cur.items=cur.items.filter(it=>(it.sharedBy||[]).length);
  save();render();
}

function switchTrip(i){db.cur=+i;cur=db.trips[db.cur];render();window.scrollTo({top:0,behavior:'smooth'});}
async function newTrip(){
  const n=await myPrompt('新行程名稱','出遊 '+(db.trips.length+1));
  if(!n)return;
  const t=blankTrip(n.trim());
  await saveToCloud(t);
  db.trips.unshift(t);db.cur=0;cur=db.trips[0];render();close_('mMenu');
}
async function renameTrip(){
  const n=await myPrompt('重新命名',cur.name);
  if(!n)return;cur.name=n.trim();save();render();close_('mMenu');
}
async function changeCurrency(){
  const c=await myPrompt('貨幣單位（例如 THB / RMB / NT$ / USD）',cur.cur);
  if(!c)return;cur.cur=c.trim();save();render();close_('mMenu');
}
async function delTrip(){
  if(db.trips.length<=1){await myAlert('無法刪除','至少保留一個行程');return;}
  if(!await myConfirm('刪除「'+cur.name+'」？','此操作無法復原'))return;
  await deleteFromCloud(cur);
  db.trips.splice(db.cur,1);db.cur=0;cur=db.trips[0];render();close_('mMenu');
}

/* ---- 結算卡片 ---- */
function showCard(){
  const r=calc();
  const st=settlements(r);
  const total=tripTotal(cur);
  const fmt=n=>cur.cur+' '+Math.round(n).toLocaleString();

  document.getElementById('cTitle').textContent=cur.name;
  document.getElementById('cDate').textContent=cur.date||'';
  document.getElementById('cTotal').textContent='總花費 '+fmt(total);

  document.getElementById('cItems').innerHTML=cur.items.length?cur.items.map(it=>{
    const sh=(it.sharedBy||[]);
    const per=sh.length?Math.round(it.amount/sh.length*10)/10:0;
    return `<div class="card-row">
      <div class="lft">
        <div class="nm">${esc(it.name)}${it.note?` <span style="font-weight:400;color:#aaa;font-size:12px">· ${esc(it.note)}</span>`:''}</div>
        <div class="sub">${it.payer?esc(it.payer)+'墊付':''} ${sh.length?'· '+sh.map(esc).join('、')+'分攤':''} ${sh.length>1?'· 每人 '+cur.cur+' '+per:''}</div>
      </div>
      <div class="val">${cur.cur} ${it.amount}</div>
    </div>`;
  }).join(''):'<div style="color:#aaa;font-size:13px;padding:6px 0">無消費記錄</div>';

  document.getElementById('cPersons').innerHTML=cur.people.map(p=>{
    const b=r[p].bal;
    const cls=b>0.01?'grn':(b<-0.01?'red':'gry');
    const tag=b>0.01?'應收回 '+fmt(b):(b<-0.01?'還需付 '+fmt(-b):'已結清');
    return `<div class="card-row">
      <div class="lft"><div class="nm">${esc(p)}</div><div class="sub">墊付 ${fmt(r[p].paid)} · 應付 ${fmt(r[p].share)}</div></div>
      <div class="val ${cls}">${tag}</div>
    </div>`;
  }).join('');

  document.getElementById('cSettle').innerHTML=st.length?st.map(s=>`
    <div class="settle-row">
      <span>${esc(s.from)}</span><span class="arrow">→</span><span>${esc(s.to)}</span>
      <span class="samt">${fmt(s.amt)}</span>
    </div>`).join(''):'<div style="color:#aaa;font-size:13px;padding:6px 0">無需結算</div>';

  document.getElementById('cardMask').classList.add('on');
}

async function doShareText(){
  const r=calc();
  const st=settlements(r);
  const total=tripTotal(cur);
  const fmt=n=>cur.cur+' '+Math.round(n).toLocaleString();
  let txt='【錢去哪了？🍃】'+cur.name+'\n';
  txt+=(cur.date||'')+'\n';
  txt+='總花費 '+fmt(total)+'\n';
  txt+='\n📋 消費明細\n';
  cur.items.forEach(it=>{
    const sh=(it.sharedBy||[]);
    txt+='• '+it.name+' '+it.amount;
    if(it.payer) txt+='｜'+it.payer+'墊';
    if(sh.length) txt+='｜'+sh.join('、')+'分';
    if(it.note) txt+='｜'+it.note;
    txt+='\n';
  });
  txt+='\n👤 每人應付\n';
  cur.people.forEach(p=>{
    const b=r[p].bal;
    const tag=b>0.01?'應收回 '+fmt(b):(b<-0.01?'還需付 '+fmt(-b):'已結清');
    txt+='• '+p+'  '+tag+'\n';
  });
  if(st.length){
    txt+='\n💸 結算\n';
    st.forEach(s=>txt+='• '+s.from+' → '+s.to+'  '+fmt(s.amt)+'\n');
  }
  if(navigator.share){
    navigator.share({title:'錢去哪了？',text:txt});
  } else {
    await navigator.clipboard.writeText(txt);
    myAlert('已複製','可貼到 LINE / WhatsApp');
  }
}

async function doShare(){
  if(navigator.share){
    const r=calc();
    const st=settlements(r);
    const txt='【錢去哪了？🍃】'+cur.name+'\n總花費 '+cur.cur+' '+Math.round(tripTotal(cur))+'\n\n💸 結算\n'+
      st.map(s=>s.from+' → '+s.to+'  '+cur.cur+' '+Math.round(s.amt)).join('\n');
    navigator.share({title:'錢去哪了？',text:txt});
  } else {
    await myAlert('截圖分享','長按畫面截圖，再分享給朋友 📸');
  }
}
